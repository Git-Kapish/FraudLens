seed: 42

paths:
  raw_data: data/raw/creditcard.csv
  processed_dir: data/processed
  models_dir: models
  figures_dir: reports/figures
  results_md: reports/results.md

split:
  train: 0.70
  val: 0.15
  test: 0.15
  min_frauds_per_split: 20
  dedup: true

cost:
  review_cost: 5.0          # ASSUMPTION: cost of manually reviewing one flagged transaction
  sensitivity_review_costs: [1, 5, 10, 25]
  # false negative cost = transaction Amount

models:
  logreg:
    max_iter: 1000
  random_forest:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 5
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
  smote:
    sampling_strategy: 0.1   # minority/majority ratio after resampling
    k_neighbors: 5

training:
  optuna_trials: 30
  cv_splits: 5
  autoencoder:
    hidden: [16, 8]
    epochs: 15
    batch_size: 512
    lr: 0.001

evaluation:
  bootstrap_resamples: 500
  precision_target: 0.90
  recall_target: 0.80
  ci_level: 0.95

api:
  max_batch_size: 1000
  p95_latency_target_ms: 50

mlflow:
  tracking_uri: file:./mlruns
  experiment: fraud-detection
