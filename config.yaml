seed: 42

paths:
  raw_data: data/raw/creditcard.csv
  processed_dir: data/processed
  models_dir: models
  figures_dir: reports/figures
  results_md: reports/results.md

split:
  train: 0.70
  val: 0.15
  test: 0.15
  min_frauds_per_split: 20
  dedup: true

cost:
  review_cost: 5.0          # ASSUMPTION: cost of manually reviewing one flagged transaction
  sensitivity_review_costs: [1, 5, 10, 25]
  # false negative cost = transaction Amount

models:
  logreg:
    max_iter: 1000
  random_forest:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 5
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
  smote:
    sampling_strategy: 0.1   # minority/majority ratio after resampling
    k_neighbors: 5
  isolation_forest:
    n_estimators: 200

training:
  optuna_trials: 30
  cv_splits: 5
  calibration_bins: 10
  deployable_models: [M3_xgb, M3_tuned, M4_xgb_smote]   # XGBoost family: TreeExplainer + low latency
  search_space:
    n_estimators: {low: 100, high: 600, type: int}
    max_depth: {low: 3, high: 8, type: int}
    learning_rate: {low: 0.01, high: 0.3, log: true}
    subsample: {low: 0.5, high: 1.0}
    colsample_bytree: {low: 0.5, high: 1.0}
    min_child_weight: {low: 1, high: 10, type: int}
    reg_lambda: {low: 0.01, high: 10.0, log: true}
    gamma: {low: 0.0, high: 5.0}
  autoencoder:
    hidden: [16, 8]
    epochs: 15
    batch_size: 512
    lr: 0.001

evaluation:
  bootstrap_resamples: 500
  precision_target: 0.90
  recall_target: 0.80
  ci_level: 0.95

api:
  max_batch_size: 1000
  p95_latency_target_ms: 50

mlflow:
  tracking_uri: file:./mlruns
  experiment: fraud-detection
