name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU-only torch is much smaller than the default CUDA build; the pinned version
      # in requirements.txt is then already satisfied.
      - name: Install dependencies
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # No dataset in CI: dashboard smoke tests skip, everything else uses synthetic data
      # or the small committed model files.
      - name: Test
        run: pytest --cov=src/fraud --cov-report=term-missing
